name: Publish approved offer

on:
  repository_dispatch:
    types: [new-offer]   # يُرسل من وكيل واتساب بعد موافقة المدير
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: new-offer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies and Chromium
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Render poster image
        run: python new_offer.py render

      - name: Commit poster image
        run: |
          git config user.name "offer-bot"
          git config user.email "offer-bot@users.noreply.github.com"
          git add -A media/offers
          git diff --cached --quiet || git commit -m "poster for offer ${{ github.event.client_payload.offer_id }}"
          git pull --rebase -q origin "$GITHUB_REF_NAME" || true
          git push -q origin HEAD:"$GITHUB_REF_NAME" || true

      - name: Publish to Blogger, Facebook and Instagram
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python new_offer.py publish

      - name: Save published state
        if: always()
        run: |
          git config user.name "offer-bot"
          git config user.email "offer-bot@users.noreply.github.com"
          git add -A state
          git diff --cached --quiet || git commit -m "state: offer ${{ github.event.client_payload.offer_id }} published"
          git pull --rebase -q origin "$GITHUB_REF_NAME" || true
          git push -q origin HEAD:"$GITHUB_REF_NAME" || true
